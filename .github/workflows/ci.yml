name: CI

# Runs on every pull request, and is reused by the deploy workflow so the same
# checks must pass before anything is built or deployed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinicpass
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: clinic
      DB_PASSWORD: clinicpass
      DB_NAME: clinic
      TEST_DATABASE_URL: postgres://clinic:clinicpass@localhost:5432/clinic?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Apply migrations
        run: go run ./cmd/migrate -dir db/migrations up

      # TEST_DATABASE_URL is set, so the integration tests (including the
      # concurrent double-booking test) run for real against Postgres.
      - name: Test
        run: go test ./... -race -count=1
