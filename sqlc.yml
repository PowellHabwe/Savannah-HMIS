version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query/**/*.sql"
    schema: "db/migrations"
    gen:
      go:
        emit_json_tags: true
        emit_empty_slices: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        json_tags_case_style: "snake"
        package: "db"
        out: "db/sqlc"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
